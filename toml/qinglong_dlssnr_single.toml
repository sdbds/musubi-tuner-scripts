# Dataset only. Model, optimizer, LoRA and output settings belong on the CLI.
[general]
resolution = [1024, 1024]
batch_size = 1
enable_bucket = true
bucket_no_upscale = true

[[datasets]]
image_directory = "../data/dlssnr/target"
control_directory = "../data/dlssnr/input"
num_repeats = 1
nr_controls_mode = "fixed"
nr_style = 0
nr_tone = 1.0
nr_structure = 1.0
nr_skin = -1.0
nr_auto_mask = true
